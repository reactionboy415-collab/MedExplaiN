        <section style="margin-top: 32px;">
          <h2>How to Understand Your Laboratory Blood Test Results</h2>
          <p>When you receive an outpatient blood test from Labcorp, Quest Diagnostics, or your hospital clinic, the document contains numerical biomarkers measured against standard biological reference intervals. Common panels include:</p>
          
          <h3>1. Complete Blood Count (CBC)</h3>
          <ul>
            <li><strong>Hemoglobin (Hb):</strong> Normal range 12.0–17.5 g/dL. Oxygen-carrying protein in red blood cells. Low levels indicate anemia, while high levels can indicate chronic dehydration or lung disease.</li>
            <li><strong>White Blood Cell Count (WBC):</strong> Normal range 4.0–11.0 x10³/µL. Immune defenders. High levels point to bacterial/viral infections or inflammation, while low levels signal immunosuppression.</li>
            <li><strong>Platelets (PLT):</strong> Normal range 150–450 x10³/µL. Essential for blood clotting and hemostasis.</li>
            <li><strong>Hematocrit (Hct):</strong> Normal range 36%–50%. The proportion of whole blood made up of red blood cells.</li>
          </ul>

          <h3>2. Comprehensive Metabolic Panel (CMP)</h3>
          <ul>
            <li><strong>Fasting Blood Glucose:</strong> Normal range 70–99 mg/dL. 100–125 mg/dL indicates prediabetes; ≥126 mg/dL signals diabetes mellitus.</li>
            <li><strong>Serum Creatinine & eGFR:</strong> Normal creatinine 0.6–1.3 mg/dL, eGFR &gt; 90 mL/min/1.73m². Measures kidney filtration capacity. Elevated creatinine or eGFR &lt; 60 indicates reduced renal function.</li>
            <li><strong>Potassium (K⁺):</strong> Normal range 3.5–5.2 mEq/L. Critical for cardiac rhythm stability.</li>
            <li><strong>Liver Enzymes (ALT & AST):</strong> ALT (7–56 U/L) and AST (8–48 U/L). Elevated enzymes indicate hepatocellular stress from fatty liver (MASLD), medications, viral hepatitis, or alcohol.</li>
          </ul>

          <h3>3. Lipid Profile & Cardiovascular Health</h3>
          <ul>
            <li><strong>Total Cholesterol:</strong> Desirable &lt; 200 mg/dL.</li>
            <li><strong>LDL Cholesterol ("Bad"):</strong> Optimal &lt; 100 mg/dL (or &lt; 70 mg/dL in high-risk patients). Forms atherosclerotic plaque in arteries.</li>
            <li><strong>HDL Cholesterol ("Good"):</strong> Optimal &gt; 40 mg/dL (men) or &gt; 50 mg/dL (women). Cardioprotective particle removing cholesterol from vessel walls.</li>
            <li><strong>Triglycerides:</strong> Normal &lt; 150 mg/dL. Excess storage fat linked to refined sugar intake and insulin resistance.</li>
          </ul>

          <h3>4. Doctor Prescription Latin Sig Abbreviations Decoded</h3>
          <ul>
            <li><strong>PO (Per Os):</strong> Take orally by mouth with water.</li>
            <li><strong>BID (Bis In Die):</strong> Take twice daily, roughly 12 hours apart (e.g., morning and evening).</li>
            <li><strong>TID (Ter In Die):</strong> Take three times daily, spaced every 8 hours.</li>
            <li><strong>QHS (Quaque Hora Somni):</strong> Take every night before bedtime.</li>
            <li><strong>PRN (Pro Re Nata):</strong> Take only as needed when specific symptoms (pain, nausea) appear.</li>
            <li><strong>AC / PC:</strong> Ante cibum (before meals) / Post cibum (after meals).</li>
          </ul>

          <p>MedExplaiN AI provides educational explanations designed to improve health literacy and foster productive doctor-patient conversations. It does not provide medical diagnoses or treatment prescriptions. Always consult a licensed healthcare professional for medical emergencies or clinical evaluation.</p>
