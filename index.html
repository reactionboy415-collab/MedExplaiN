        <section style="margin-top: 36px;">
          <h2>The Biomarker Knowledge Vault: 4 Foundational Clinical Panels</h2>
          
          <h3>Panel A: Hematology & Cell Kinetics</h3>
          <ul>
            <li><strong>Hemoglobin (Hb):</strong> Adult Males: 13.8–17.2 g/dL | Females: 12.1–15.1 g/dL. Low indicates anemia (iron deficiency, chronic blood loss, renal erythropoietin failure); high indicates hemoconcentration, chronic hypoxemia, or polycythemia vera. Questions: Could my fatigue or shortness of breath be explained by this hemoglobin level?</li>
            <li><strong>Platelets (PLT):</strong> 150,000–450,000 /µL. Essential for primary hemostatic plug formation. Low indicates viral suppression (Dengue), immune thrombocytopenic purpura (ITP), or splenomegaly; high indicates reactive thrombocytosis, occult inflammation, or myeloproliferative disorders. Questions: Am I at risk of spontaneous bruising or bleeding?</li>
            <li><strong>Total Leukocyte Count (TLC/WBC):</strong> 4,000–11,000 /µL. First-line immune defense. High indicates pyogenic bacterial infection or systemic inflammation; low signals severe sepsis, viral marrow suppression, or drug-induced leukopenia. Questions: Does this suggest bacterial vs viral etiology?</li>
            <li><strong>Absolute Neutrophil Count (ANC):</strong> 1,500–8,000 /µL. Critical defense against acute bacterial pathogens. Level &lt; 500/µL poses high infection vulnerability (febrile neutropenia).</li>
            <li><strong>Erythrocyte Sedimentation Rate (ESR):</strong> 0–20 mm/hr. Indirect marker of acute-phase reactant proteins and systemic inflammatory conditions like rheumatoid arthritis or polymyalgia rheumatica.</li>
          </ul>

          <h3>Panel B: Renal Function & Electrolytes</h3>
          <ul>
            <li><strong>Serum Creatinine:</strong> 0.6–1.3 mg/dL. Metabolic byproduct of muscle phosphocreatine. Elevated levels indicate reduced glomerular filtration clearance, acute kidney injury (AKI), or chronic kidney disease (CKD). Questions: Does this rise suggest temporary dehydration or parenchymal renal stress?</li>
            <li><strong>Blood Urea Nitrogen (BUN):</strong> 7–20 mg/dL. Principal waste product of protein breakdown. BUN/Creatinine ratio &gt; 20:1 strongly points to prerenal volume contraction/dehydration.</li>
            <li><strong>Estimated Glomerular Filtration Rate (eGFR):</strong> &gt; 90 mL/min/1.73m² (Normal). &lt; 60 mL/min for &gt; 3 months marks chronic kidney disease (CKD Stages 3 to 5). Questions: What stage of renal function does this represent?</li>
            <li><strong>Sodium / Potassium Ratio (Na⁺ / K⁺):</strong> Serum Sodium 135–145 mEq/L, Serum Potassium 3.5–5.0 mEq/L. Hyperkalemia carries urgent cardiac arrhythmia and conduction blockade risks.</li>
          </ul>

          <h3>Panel C: Hepatic & Metabolic Profile</h3>
          <ul>
            <li><strong>Bilirubin (Direct & Total):</strong> Total 0.2–1.2 mg/dL, Direct 0.0–0.3 mg/dL. Elevated unconjugated indicates hemolysis or Gilbert syndrome; elevated conjugated indicates biliary obstruction or cholestasis.</li>
            <li><strong>SGPT / ALT (Alanine Aminotransferase):</strong> 7–56 U/L. Cytosolic enzyme concentrated in functional hepatocytes. Rises during metabolic dysfunction-associated steatotic liver disease (MASLD), medication hepatotoxicity, or acute viral hepatitis.</li>
            <li><strong>SGOT / AST (Aspartate Aminotransferase):</strong> 8–48 U/L. Found in liver, myocardium, and skeletal muscle. An AST:ALT ratio &gt; 2:1 strongly hints at alcoholic liver injury.</li>
            <li><strong>Alkaline Phosphatase (ALP):</strong> 44–147 U/L. Elevated in biliary duct obstruction or high bone-turnover states (Paget's disease, osteomalacia).</li>
          </ul>

          <h3>Panel D: Endocrine & Glycemic Indices</h3>
          <ul>
            <li><strong>Fasting Blood Glucose:</strong> Normal: 70–99 mg/dL | Prediabetes: 100–125 mg/dL | Diabetes Mellitus: &ge; 126 mg/dL after 8–12 hour fast.</li>
            <li><strong>Hemoglobin A1c (HbA1c):</strong> Normal: &lt; 5.7% | Prediabetes: 5.7%–6.4% | Diabetes: &ge; 6.5%. Provides a stable 90–120 day panoramic index of sustained glycemic exposure.</li>
            <li><strong>Thyroid Stimulating Hormone (TSH):</strong> 0.4–4.5 mIU/L. Anterior pituitary glycoprotein regulator. Elevated in primary hypothyroidism; suppressed in thyrotoxicosis.</li>
            <li><strong>Free T3 & Free T4:</strong> Free T4: 0.8–1.8 ng/dL, Free T3: 2.3–4.2 pg/mL. Active circulating hormone fractions reflecting peripheral conversion and cellular metabolic rate.</li>
          </ul>

          <p>1. <strong>CBC:</strong> Complete Blood Count • 2. <strong>LFT:</strong> Liver Function Tests • 3. <strong>KFT/RFT:</strong> Kidney / Renal Function Tests • 4. <strong>TSH:</strong> Thyroid Stimulating Hormone • 5. <strong>HbA1c:</strong> Glycated Hemoglobin A1c • 6. <strong>CRP:</strong> C-Reactive Protein • 7. <strong>ESR:</strong> Erythrocyte Sedimentation Rate • 8. <strong>MCV:</strong> Mean Corpuscular Volume • 9. <strong>MCH:</strong> Mean Corpuscular Hemoglobin • 10. <strong>RDW:</strong> Red Cell Distribution Width • 11. <strong>BUN:</strong> Blood Urea Nitrogen • 12. <strong>SGPT:</strong> Serum Glutamic Pyruvic Transaminase (ALT) • 13. <strong>SGOT:</strong> Serum Glutamic Oxaloacetic Transaminase (AST) • 14. <strong>ALP:</strong> Alkaline Phosphatase • 15. <strong>HDL:</strong> High-Density Lipoprotein Cholesterol • 16. <strong>LDL:</strong> Low-Density Lipoprotein Cholesterol • 17. <strong>VLDL:</strong> Very Low-Density Lipoprotein • 18. <strong>eGFR:</strong> Estimated Glomerular Filtration Rate • 19. <strong>PT/INR:</strong> Prothrombin Time / International Normalized Ratio • 20. <strong>Ferritin:</strong> Serum Ferritin (Iron Storage Protein).</p>
